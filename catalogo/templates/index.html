<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ferretería - Catálogo de Productos</title>
</head>
<body>
    <h1>Catálogo de Ferretería</h1>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ producto.nombre }}</td>
                <td>{{ producto.categoria }}</td>
                <td>${{ producto.precio }}</td>
                <td>{{ producto.stock }} un.</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay productos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
